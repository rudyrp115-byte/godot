
name: Build Godot 3.6.3 Android Editor

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-editor:
    name: Build Android editor (ARM64)
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: |
            platform-tools
            platforms;android-32
            build-tools;32.0.0
            ndk;23.2.8568313

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            python3 \
            python3-pip \
            yasm
          python3 -m pip install --user scons
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure Android environment
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/23.2.8568313" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/23.2.8568313" >> "$GITHUB_ENV"

      - name: Build Godot Android editor libraries
        run: |
          scons platform=android target=release_debug tools=yes android_arch=arm64v8 -j2

      - name: Generate Android editor APK
        run: |
          cd platform/android/java
          chmod +x gradlew
          ./gradlew --no-daemon generateGodotEditor

      - name: Upload Android editor APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Godot-3.6.3-Android-Editor-ARM64
          path: bin/android_editor_builds/*.apk
          if-no-files-found: warn
          retention-days: 7
          
