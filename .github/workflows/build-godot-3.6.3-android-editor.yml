name: Build Godot 3.6.3 Android Editor

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-33" "build-tools;33.0.2" "ndk;23.2.8568313"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config yasm
          python -m pip install scons

      - name: Configure Android environment
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/23.2.8568313" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/23.2.8568313" >> "$GITHUB_ENV"

      - name: Build Godot Android editor
        run: |
          scons platform=android target=release_debug tools=yes android_arch=arm64v8 -j2

      - name: Build editor APK
        run: |
          cd platform/android/java
          chmod +x gradlew
          ./gradlew --no-daemon generateGodotEditor

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Godot-3.6.3-Android-Editor-ARM64
          path: bin/android_editor_builds/*.apk
          if-no-files-found: warn
          retention-days: 7
