name: Build Godot 3.6.3 Android Editor

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android editor ARM64
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-32 build-tools;32.0.0 ndk;23.2.8568313'

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config python3 python3-pip yasm libxcursor-dev libx11-dev libxinerama-dev libxi-dev libxrandr-dev libxrender-dev libgl1-mesa-dev libglu1-mesa-dev libasound2-dev libpulse-dev libudev-dev
          python3 -m pip install --user scons
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/23.2.8568313" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/23.2.8568313" >> "$GITHUB_ENV"

      - name: Build Godot Android editor
        run: scons platform=android target=release_debug tools=yes arch=arm64 android_arch=arm64v8 -j2

      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-3.6.3-android-arm64-editor
          path: |
            bin/*android*arm64*
            bin/*.apk
          if-no-files-found: warn
          retention-days: 7
